name: build

# 打 tag（v1.0.0）或手动触发时出包：
#   macOS  → dmg + zip（arm64 / x64）
#   Windows → NSIS 安装包（x64 / arm64）
# 为什么不在 mac 上打 Windows 包：NSIS 与签名链路在各自平台上最稳，
# 一台机器全出属于给自己制造问题。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 有证书时在仓库 Secrets 里配 CSC_LINK / CSC_KEY_PASSWORD，
      # mac 再加 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 并打开 notarize；
      # 没有证书时这一步会以“skipped macOS application code signing”跳过，照样出包。
      - name: Build
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          if-no-files-found: warn
