appId: com.maidong.archboard
productName: Boundless          # 用 ASCII：文件名、体积统计、更新包路径都会用到
copyright: © maidong · github.com/Mr-Maidong

directories:
  output: dist
  buildResources: build

# 只收运行时真正需要的文件；docs/、README、_headers 不进包
files:
  - index.html
  - app.js
  - app.css
  - brand/**/*
  - main.js
  - package.json

asar: true
compression: maximum

# 双击 .archboard 直接用无边画板打开。
# mac 会写进 Info.plist 的 CFBundleDocumentTypes，Windows 会注册到注册表。
fileAssociations:
  - ext: archboard
    name: Boundless 工程
    description: 无边画板工程包
    role: Editor
    mimeType: application/x-archboard

mac:
  category: public.app-category.graphics-design
  darkModeSupport: true
  hardenedRuntime: true
  # 没有 Apple Developer 证书时不要开公证，否则构建直接失败
  # notarize: true
  # 默认只出当前机器的 arm64 dmg。需要 Intel 包时显式跑
  #   npx electron-builder --mac --x64
  # 要加自动更新（zip + blockmap）时，把下面的 zip 目标放回来。
  target:
    - target: dmg
      arch: [arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false   # 卸载不删工程数据
  shortcutName: 无边画板
